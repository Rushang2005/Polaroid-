<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polaroid Studio Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat&family=Courier+Prime&family=Dancing+Script&family=Inter:wght@400;700;800&family=Montserrat:ital,wght@0,400;1,400&family=Playfair+Display:ital@1&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    :root {
        --primary: #c084fc;
        --secondary: #6366f1;
        --accent: #f472b6;
        --bg: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-main: #f8fafc;
        --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; transition: all 0.2s ease; }

    body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        color: var(--text-main);
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    .sidebar {
        width: 400px;
        padding: 30px;
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        border-right: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        gap: 24px;
        overflow-y: auto;
        box-shadow: 10px 0 30px rgba(0,0,0,0.3);
    }

    h1 {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -1px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: linear-gradient(to right, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .section-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--primary);
        margin-bottom: 12px;
        font-weight: 700;
    }

    .card {
        background: rgba(255, 255, 255, 0.03);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid var(--glass-border);
    }

    label { font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 8px; }
    
    input[type="text"], select {
        width: 100%;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        color: white;
        font-size: 0.9rem;
        outline: none;
    }

    input[type="color"] {
        border: none; width: 100%; height: 40px; border-radius: 8px; cursor: pointer; background: none;
    }

    input[type="range"] {
        width: 100%; height: 6px; border-radius: 5px; appearance: none; background: rgba(255,255,255,0.1);
    }
    
    input[type="range"]::-webkit-slider-thumb {
        appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer;
    }

    .photo-control-item {
        background: rgba(255, 255, 255, 0.05);
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 16px;
        border-left: 4px solid var(--primary);
    }

    .ctrl-top { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; }
    .ctrl-top img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 2px solid var(--glass-border); }

    .remove-btn {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #f87171;
        font-size: 0.75rem;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
    }
    .remove-btn:hover { background: #ef4444; color: white; }

    .btn-main {
        padding: 18px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, var(--secondary), var(--primary));
        color: white;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(99, 102, 241, 0.4); }

    .workspace {
        flex: 1;
        padding: 60px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: auto;
        background: #020617;
    }

    .canvas-container {
        padding: 20px;
        background: #1e293b;
        border-radius: 4px;
        box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        position: relative;
    }

    #a4Canvas {
        display: block;
        max-width: 100%;
        height: auto;
        background: white;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
</style>
</head>
<body>

<div class="sidebar">
    <h1>Polaroid Studio</h1>
    
    <div class="card">
        <div class="section-title">Global Styles</div>
        <label>Page Background</label>
        <input type="color" id="bgColorPicker" value="#ffffff">
        
        <label style="margin-top:15px">Frame Theme</label>
        <select id="frameTheme">
            <option value="#ffffff">Pure White</option>
            <option value="#fdfdfd">Warm Ivory</option>
            <option value="#1a1a1a">Midnight Black</option>
            <option value="#e2e8f0">Cool Slate</option>
        </select>

        <label style="margin-top:15px">Caption Font</label>
        <select id="fontStyle">
            <option value="italic 44px 'Playfair Display'">Elegant Serif</option>
            <option value="48px 'Caveat'">Handwritten</option>
            <option value="42px 'Dancing Script'">Fancy Script</option>
            <option value="40px 'Courier Prime'">Typewriter</option>
            <option value="bold 40px 'Montserrat'">Modern Sans</option>
            <option value="italic 44px 'Georgia'">Classic Georgia</option>
        </select>

        <label style="margin-top:15px">Fitting Mode</label>
        <select id="cropMode">
            <option value="fill">Fill Frame (Auto-Crop)</option>
            <option value="fit">Fit Whole Image</option>
        </select>
        
        <div style="margin-top:15px; display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="vignetteToggle" checked style="width:20px; height:20px;">
            <label style="margin:0">Soft Vignette</label>
        </div>

        <div style="margin-top:15px; display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="guidesToggle" style="width:20px; height:20px;">
            <label style="margin:0">Cutting Guides</label>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Import</div>
        <label>Upload Photos (Max 9)</label>
        <input type="file" id="imageLoader" accept="image/*" multiple>
    </div>

    <div id="captionList" style="display:none;">
        <div class="section-title">Photo Layers</div>
        <div id="individualCaptions"></div>
    </div>

    <button class="btn-main" id="downloadPdf">Export Print-Ready PDF</button>
</div>

<div class="workspace">
    <div class="canvas-container">
        <canvas id="a4Canvas"></canvas>
    </div>
</div>

<script>
const { jsPDF } = window.jspdf;
const canvas = document.getElementById("a4Canvas");
const ctx = canvas.getContext("2d");
const imageLoader = document.getElementById("imageLoader");
const individualCaptions = document.getElementById("individualCaptions");
const captionList = document.getElementById("captionList");

const A4_WIDTH = 2480;
const A4_HEIGHT = 3508;
canvas.width = A4_WIDTH;
canvas.height = A4_HEIGHT;
canvas.style.width = "550px";

let pageColor = "#ffffff";
let frameColor = "#ffffff";
let captionFont = "italic 44px 'Playfair Display'";
let cropMode = "fill";
let vignetteEnabled = true;
let guidesEnabled = false;
let photoData = [];

// Event Listeners
document.getElementById("bgColorPicker").oninput = e => { pageColor = e.target.value; render(); };
document.getElementById("frameTheme").onchange = e => { frameColor = e.target.value; render(); };
document.getElementById("fontStyle").onchange = e => { captionFont = e.target.value; render(); };
document.getElementById("cropMode").onchange = e => { cropMode = e.target.value; render(); };
document.getElementById("vignetteToggle").onchange = e => { vignetteEnabled = e.target.checked; render(); };
document.getElementById("guidesToggle").onchange = e => { guidesEnabled = e.target.checked; render(); };

imageLoader.onchange = e => {
    const files = Array.from(e.target.files);
    files.slice(0, 9 - photoData.length).forEach(file => {
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
                photoData.push({
                    id: 'id-' + Math.random().toString(36).substr(2, 9),
                    img,
                    caption: "",
                    heightRatio: 0.85,
                    rotation: 0
                });
                buildUI();
                render();
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });
    captionList.style.display = "block";
};

function buildUI(){
    individualCaptions.innerHTML = "";
    photoData.forEach(p => {
        const d = document.createElement("div");
        d.className = "photo-control-item";
        d.innerHTML = `
            <div class="ctrl-top">
                <img src="${p.img.src}">
                <input type="text" placeholder="Add a caption..." value="${p.caption}"
                    oninput="updateCap('${p.id}', this.value)">
            </div>
            <label>Rotation (${p.rotation}°)</label>
            <input type="range" min="-15" max="15" step="1"
                value="${p.rotation}"
                oninput="updateRotation('${p.id}', this.value)">
            <label style="margin-top:10px">Scale</label>
            <input type="range" min="0.6" max="0.95" step="0.01"
                value="${p.heightRatio}"
                oninput="updateHeight('${p.id}', this.value)">
            <button class="remove-btn" onclick="removePhoto('${p.id}')">Remove Photo</button>
        `;
        individualCaptions.appendChild(d);
    });
}

window.updateCap = (id, val) => {
    const p = photoData.find(x => x.id === id);
    if (p) p.caption = val.slice(0, 40);
    render();
};

window.updateHeight = (id, val) => {
    const p = photoData.find(x => x.id === id);
    if (p) p.heightRatio = parseFloat(val);
    render();
};

window.updateRotation = (id, val) => {
    const p = photoData.find(x => x.id === id);
    if (p) {
        p.rotation = parseInt(val);
        const label = document.querySelector(`input[oninput*="updateRotation('${id}'"]`).previousElementSibling;
        label.innerText = `Rotation (${val}°)`;
    }
    render();
};

window.removePhoto = id => {
    photoData = photoData.filter(p => p.id !== id);
    imageLoader.value = ""; 
    buildUI();
    if (!photoData.length) captionList.style.display = "none";
    render();
};

function drawAutoFit(img, x, y, w, h, rotationDeg) {
    const imgRatio = img.width / img.height;
    const containerRatio = w / h;
    let sx = 0, sy = 0, sw = img.width, sh = img.height;

    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.rotate(rotationDeg * Math.PI / 180);

    if (cropMode === "fill") {
        if (imgRatio > containerRatio) {
            sw = img.height * containerRatio;
            sx = (img.width - sw) / 2;
        } else {
            sh = img.width / containerRatio;
            sy = (img.height - sh) / 2;
        }
        ctx.drawImage(img, sx, sy, sw, sh, -w / 2, -h / 2, w, h);
    } else {
        let dw, dh;
        if (imgRatio < containerRatio) {
            dh = h; dw = dh * imgRatio;
        } else {
            dw = w; dh = dw / imgRatio;
        }
        ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
    }
    ctx.restore();
}

function drawPolaroidFade(x, y, w, h){
    const r = Math.min(w, h);
    const g = ctx.createRadialGradient(x+w/2,y+h/2,r*0.4,x+w/2,y+h/2,r*0.7);
    g.addColorStop(0,"rgba(255,255,255,0)");
    g.addColorStop(1,"rgba(0,0,0,0.06)");
    ctx.fillStyle = g;
    ctx.fillRect(x,y,w,h);
}

function drawCuttingGuides(x, y, w, h) {
    ctx.save();
    ctx.setLineDash([10, 10]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = (pageColor.toLowerCase() === "#ffffff") ? "#cbd5e1" : "rgba(255,255,255,0.3)";
    ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
    ctx.restore();
}

function render(){
    ctx.fillStyle = pageColor;
    ctx.fillRect(0,0,A4_WIDTH,A4_HEIGHT);
    
    if (!photoData.length) {
        ctx.fillStyle = "#94a3b8";
        ctx.font = "40px 'Inter'";
        ctx.textAlign = "center";
        ctx.fillText("Upload photos to begin your layout", A4_WIDTH/2, A4_HEIGHT/2);
        return;
    }

    const cols = 3;
    const margin = 160;
    const gap = 85;
    const baseW = 700;
    const baseH = 950;

    photoData.forEach((p, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x = margin + col * (baseW + gap);
        const y = margin + row * (baseH + gap);

        if (guidesEnabled) drawCuttingGuides(x, y, baseW, baseH);

        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.15)";
        ctx.shadowBlur = 50;
        ctx.shadowOffsetY = 20;
        ctx.fillStyle = frameColor;
        ctx.fillRect(x, y, baseW, baseH);
        ctx.restore();

        const pad = 55;
        const maxImgH = baseH - (p.caption ? 180 : 120);
        const currentImgH = maxImgH * p.heightRatio;
        
        drawAutoFit(p.img, x + pad, y + pad, baseW - (pad * 2), currentImgH, p.rotation);

        if (vignetteEnabled && frameColor !== "#1a1a1a") {
            drawPolaroidFade(x + pad, y + pad, baseW - (pad * 2), currentImgH);
        }

        if (p.caption){
            ctx.fillStyle = (frameColor === "#1a1a1a" || frameColor === "#111") ? "#ffffff" : "#2d3748";
            ctx.font = captionFont;
            ctx.textAlign = "center";
            ctx.fillText(p.caption, x + baseW/2, y + baseH - 70);
        }
    });
}

document.getElementById("downloadPdf").onclick = () => {
    if (!photoData.length) return alert("Please add some photos first!");
    const pdf = new jsPDF({ orientation: "p", unit: "mm", format: "a4" });
    const imgData = canvas.toDataURL("image/jpeg", 0.98);
    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    pdf.save("my-polaroids.pdf");
};

document.fonts.ready.then(() => render());
</script>
</body>
</html>
